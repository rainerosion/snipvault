name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to dry-run, e.g. v2.1.0. Manual runs never publish."
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release mode
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
            PUBLISH="false"
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
            PUBLISH="true"
          else
            echo "Release workflow only publishes from tags; manual runs are dry-run only."
            exit 1
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Check version/tag consistency
        env:
          SNIPVAULT_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run versions:check

      - name: Check icons
        run: npm run icons:check

  build-windows:
    name: Windows x64 bundles
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version/tag consistency
        env:
          SNIPVAULT_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: npm run versions:check

      - name: Check icons
        run: npm run icons:check

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --allow-downgrade
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (!(Test-Path $wixPath)) {
            throw "WiX path not found: $wixPath"
          }
          "TAURI_BUNDLER_WIX_PATH=$wixPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri
        run: npm run tauri:build

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $portableDir = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          if (Test-Path "src-tauri/target/release/snipvault.exe") {
            Copy-Item "src-tauri/target/release/snipvault.exe" "$portableDir/SnipVault-portable.exe" -Force
          } elseif (Test-Path "src-tauri/target/release/SnipVault.exe") {
            Copy-Item "src-tauri/target/release/SnipVault.exe" "$portableDir/SnipVault-portable.exe" -Force
          } else {
            throw "Portable executable not found in src-tauri/target/release"
          }

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/portable/SnipVault-portable.exe"
          )
          foreach ($pattern in $required) {
            if (-not (Get-ChildItem $pattern -ErrorAction SilentlyContinue)) {
              throw "Missing required artifact pattern: $pattern"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/SnipVault-portable.exe
          if-no-files-found: error
          retention-days: 5

  build-macos:
    name: macOS universal bundle
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version/tag consistency
        env:
          SNIPVAULT_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: npm run versions:check

      - name: Check icons
        run: npm run icons:check

      - name: Build Tauri universal bundle
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Verify macOS artifacts
        shell: bash
        run: |
          shopt -s nullglob
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          app=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ ${#dmg[@]} -eq 0 ]; then
            echo "Missing macOS DMG artifact"
            exit 1
          fi
          if [ ${#app[@]} -eq 0 ]; then
            echo "Missing macOS .app bundle for architecture verification"
            exit 1
          fi
          binary="${app[0]}/Contents/MacOS/SnipVault"
          if [ ! -f "$binary" ]; then
            binary="${app[0]}/Contents/MacOS/snipvault"
          fi
          if [ ! -f "$binary" ]; then
            echo "Missing app executable inside ${app[0]}"
            exit 1
          fi
          lipo -info "$binary" | tee lipo.txt
          grep -q "x86_64" lipo.txt
          grep -q "arm64" lipo.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Linux amd64 bundles
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version/tag consistency
        env:
          SNIPVAULT_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: npm run versions:check

      - name: Check icons
        run: npm run icons:check

      - name: Build Tauri
        run: npm run tauri:build

      - name: Verify Linux artifacts
        shell: bash
        run: |
          shopt -s nullglob globstar
          deb=(src-tauri/target/release/bundle/deb/**/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#deb[@]} -eq 0 ]; then
            echo "Missing deb artifact"
            exit 1
          fi
          if [ ${#appimage[@]} -eq 0 ]; then
            echo "Missing AppImage artifact"
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 5

  release:
    name: Checksums, attestations, and release
    needs: [validate, build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifact set and create checksums
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*)
          regular=()
          for file in "${files[@]}"; do
            [ -f "$file" ] && regular+=("$file")
          done
          if [ ${#regular[@]} -eq 0 ]; then
            echo "No artifacts downloaded"
            exit 1
          fi
          required=("*.msi" "*.exe" "*.dmg" "*.deb" "*.AppImage")
          for pattern in "${required[@]}"; do
            matches=(artifacts/**/$pattern)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "Missing release artifact matching $pattern"
              exit 1
            fi
          done
          if compgen -G "artifacts/**/*.app" > /dev/null; then
            echo ".app directories must not be uploaded as release assets"
            exit 1
          fi
          (cd artifacts && sha256sum $(find . -type f | sort) > SHA256SUMS)
          cat artifacts/SHA256SUMS

      - name: Upload dry-run artifact set
        if: ${{ needs.validate.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7

      - name: Generate artifact attestations
        if: ${{ needs.validate.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS

      - name: Create GitHub Release
        if: ${{ needs.validate.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "灵藏 SnipVault ${{ needs.validate.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, 'beta') || contains(needs.validate.outputs.tag, 'alpha') || contains(needs.validate.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
